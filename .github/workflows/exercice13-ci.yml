name: Exercice 13 - API bancaire CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'exercice13/**'
      - '.github/workflows/exercice13-ci.yml'

  pull_request:
    branches:
      - main
      - master
    paths:
      - 'exercice13/**'
      - '.github/workflows/exercice13-ci.yml'

  workflow_dispatch:

defaults:
  run:
    working-directory: exercice13

jobs:
  test-and-reports:
    name: Tests, rapports JaCoCo et Cucumber
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer Java 21 avec cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Vérifier Java et Maven
        run: |
          java -version
          mvn -version

      - name: Lancer les tests et générer les rapports
        run: mvn clean verify

      - name: Publier les rapports Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: exercice13/target/surefire-reports/**
          if-no-files-found: warn

      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: exercice13/target/site/jacoco/**
          if-no-files-found: warn

      - name: Publier les rapports Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-cucumber
          path: exercice13/target/cucumber-reports/**
          if-no-files-found: warn
